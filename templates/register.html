{% load static %}
<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{{ page_title|default:"Create Account - LankaWeather" }}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#607AFB",
              "background-dark": "#0f1323",
              "card-dark": "#181d35",
            },
            fontFamily: { display: ["Inter", "sans-serif"] },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-background-dark text-white min-h-screen flex items-center justify-center"
  >
    <div class="w-full max-w-md mx-4">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-3 mb-2">
          <div
            class="bg-primary size-12 rounded-xl flex items-center justify-center text-white"
          >
            <span class="material-symbols-outlined text-2xl">tsunami</span>
          </div>
          <h1 class="font-bold text-2xl">LankaWeather</h1>
        </div>
        <p class="text-slate-400 text-sm">
          Create a free account to get started
        </p>
      </div>

      <!-- Messages -->
      {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
        <div
          class="px-4 py-3 rounded-lg text-sm mb-2 {% if message.tags == 'error' %}bg-red-500/20 text-red-400{% else %}bg-green-500/20 text-green-400{% endif %}"
        >
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <!-- Register Form -->
      <div class="bg-card-dark rounded-xl shadow-lg p-8">
        <form method="post" class="space-y-5">
          {% csrf_token %}
          <div>
            <label
              for="username"
              class="block text-sm font-medium text-slate-300 mb-1.5"
              >Username</label
            >
            <input
              type="text"
              name="username"
              id="username"
              required
              autofocus
              class="w-full bg-background-dark border border-slate-700 rounded-lg px-4 py-2.5 text-white text-sm focus:ring-2 focus:ring-primary focus:border-transparent placeholder:text-slate-500"
              placeholder="Choose a username"
            />
          </div>
          <div>
            <label
              for="email"
              class="block text-sm font-medium text-slate-300 mb-1.5"
              >Email <span class="text-slate-500">(optional)</span></label
            >
            <input
              type="email"
              name="email"
              id="email"
              class="w-full bg-background-dark border border-slate-700 rounded-lg px-4 py-2.5 text-white text-sm focus:ring-2 focus:ring-primary focus:border-transparent placeholder:text-slate-500"
              placeholder="you@example.com"
            />
          </div>
          <div>
            <label
              for="password1"
              class="block text-sm font-medium text-slate-300 mb-1.5"
              >Password</label
            >
            <input
              type="password"
              name="password1"
              id="password1"
              required
              class="w-full bg-background-dark border border-slate-700 rounded-lg px-4 py-2.5 text-white text-sm focus:ring-2 focus:ring-primary focus:border-transparent placeholder:text-slate-500"
              placeholder="At least 6 characters"
            />
          </div>
          <div>
            <label
              for="password2"
              class="block text-sm font-medium text-slate-300 mb-1.5"
              >Confirm Password</label
            >
            <input
              type="password"
              name="password2"
              id="password2"
              required
              class="w-full bg-background-dark border border-slate-700 rounded-lg px-4 py-2.5 text-white text-sm focus:ring-2 focus:ring-primary focus:border-transparent placeholder:text-slate-500"
              placeholder="Repeat your password"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-primary hover:bg-primary/90 text-white py-2.5 rounded-lg font-bold text-sm transition-colors"
          >
            Create Account
          </button>
        </form>
      </div>

      <p class="text-center text-sm text-slate-400 mt-6">
        Already have an account?
        <a
          href="{% url 'login' %}"
          class="text-primary font-bold hover:underline"
          >Sign in</a
        >
      </p>
    </div>
  </body>
</html>
